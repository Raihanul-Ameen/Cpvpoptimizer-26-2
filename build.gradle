plugins {
    // Hardcoded plugin version fixes the Gradle 9 initialization phase crash
    id 'net.fabricmc.fabric-loom' version '1.17'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    // Required wrapper block for naming archives in Gradle 9+
    archivesName = project.archives_base_name
}

repositories {
    // Essential fallbacks for optional external dependencies
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "crystal_optimizer" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Standard target strings mapped to your gradle.properties file values
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Modern Fabric API bindings for Minecraft 26.2
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Fully supports the Minecraft 26 update ecosystem requiring Java 25 compiled environments
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.archives_base_name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Build output location variables can be specified here
    }
}
